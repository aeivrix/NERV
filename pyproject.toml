[project]
name = "probe-eeg"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mne>=1.13",
    "mne-bids>=0.20",
    "openneuro-py>=2026.9",
    "numpy>=2.5",
    "scipy>=1.18",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
]

[dependency-groups]
dev = ["jupyterlab"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
