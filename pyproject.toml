[project]
name = "probe-eeg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mne",
    "mne-bids",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "jupyter",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
